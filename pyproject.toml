[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-diet-cli"
version = "0.2.2"
description = "Diagnostic tools and methodology to audit and optimize token footprint in AI coding workflows"

readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "joseoper", email = "joseoper@users.noreply.github.com" }
]
keywords = ["tokens", "llm", "claude", "gemini", "codex", "opencode", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
token-diet = "token_diet.cli:main"
